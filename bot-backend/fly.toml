# fly.toml app configuration file generated for pm-frontrun-snowy-waterfall-1028 on 2026-02-19T11:27:26-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pm-frontrun-snowy-waterfall-1028'
primary_region = 'iad'

[build]

[env]
  DEFAULT_BUY_SIZE = '1'
  LOG_LEVEL = 'info'
  PLATFORM = 'kalshi'
  TEST_MODE = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = 'performance-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
